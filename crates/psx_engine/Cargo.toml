[package]
name = "psx_engine"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
psx_gpu = { path = "../psx_gpu" }
wgpu.workspace = true
winit.workspace = true
log.workspace = true
web-time = "1"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
pollster.workspace = true
env_logger.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen.workspace = true
wasm-bindgen-futures.workspace = true
web-sys = { workspace = true, features = ["Document", "Window", "Element", "HtmlCanvasElement", "CssStyleDeclaration", "Location", "Navigator", "Gamepad", "GamepadButton", "GamepadMappingType", "AudioContext", "AudioBuffer", "AudioBufferSourceNode", "AudioNode", "AudioParam", "GainNode", "AudioDestinationNode", "BaseAudioContext", "AudioScheduledSourceNode"] }
console_error_panic_hook.workspace = true
console_log.workspace = true
